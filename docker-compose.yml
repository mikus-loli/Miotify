services:
  miotify:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/${GITHUB_REPOSITORY:-miotify/miotify}:latest
    container_name: miotify
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - TZ=${TZ:-Asia/Shanghai}
      - JWT_SECRET=${JWT_SECRET:-}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - DEFAULT_ADMIN_USER=${DEFAULT_ADMIN_USER:-admin}
      # ⚠️ 生产环境务必通过环境变量修改默认管理员密码！
      - DEFAULT_ADMIN_PASS=${DEFAULT_ADMIN_PASS:-admin}
      - LOG_RETENTION_COUNT=${LOG_RETENTION_COUNT:-5000}
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-30}
      # 跨域白名单，留空 = 同源部署（推荐）
      # - CORS_ORIGIN=${CORS_ORIGIN:-}
    volumes:
      - miotify-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  miotify-data:
